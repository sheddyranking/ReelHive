<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReelHive · share short videos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23f5b301' d='M12 2l8.66 5v10L12 22l-8.66-5V7z'/></svg>">
</head>
<body>
  <!-- ===== Sidebar (desktop) ===== -->
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="ReelHive home">
      <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true">
        <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/>
        <path d="M10 8.5v7l6-3.5z" class="play"/>
      </svg>
      <span>Reel<strong>Hive</strong></span>
    </a>

    <form class="search" id="searchForm" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="Search videos, #tags, people" autocomplete="off" aria-label="Search">
    </form>

    <nav class="nav" aria-label="Main">
      <button class="nav-item active" data-view="new">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>For you</span>
      </button>
      <button class="nav-item" data-view="popular">
        <svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 2 1.3 3 2.5 3C11 9 11 6 12 3z"/></svg>
        <span>Popular</span>
      </button>
      <button class="nav-item" data-view="saved">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span>Saved</span>
      </button>
      <button class="nav-item" data-open-upload>
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>
        <span>Upload</span>
      </button>
    </nav>

    <footer class="side-foot">
      <p>Swipe, scroll or use <kbd>↑</kbd> <kbd>↓</kbd> to browse. <kbd>Space</kbd> pauses, <kbd>M</kbd> mutes.</p>
      <p class="muted">ReelHive · COM769 prototype</p>
    </footer>
  </aside>

  <!-- ===== Mobile top bar ===== -->
  <header class="mobile-top">
    <a class="brand" href="/" aria-label="ReelHive home">
      <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/><path d="M10 8.5v7l6-3.5z" class="play"/></svg>
    </a>
    <div class="m-tabs">
      <button class="m-tab active" data-view="new">For you</button>
      <button class="m-tab" data-view="popular">Popular</button>
    </div>
    <button class="icon-btn" id="mSearchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </header>

  <!-- ===== Main stage ===== -->
  <main class="stage">
    <div class="filter-chip" id="filterChip" hidden>
      <span id="filterText"></span>
      <button id="clearFilter" aria-label="Clear search">✕</button>
    </div>

    <section id="feed" class="feed" aria-live="polite"></section>

    <div class="stage-nav">
      <button class="round-btn" id="prevBtn" aria-label="Previous video">
        <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <button class="round-btn" id="nextBtn" aria-label="Next video">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/></svg>
      <h2 id="emptyTitle">The hive is empty</h2>
      <p id="emptyText">Be the first to share a short video.</p>
      <button class="btn btn-primary" id="emptyAction">Upload a video</button>
    </div>
  </main>

  <!-- ===== Comments panel ===== -->
  <aside class="comments-panel" id="commentsPanel" aria-hidden="true">
    <header class="panel-head">
      <div>
        <h2>Comments <span id="commentCount" class="muted"></span></h2>
        <p id="commentsTitle" class="muted small"></p>
      </div>
      <button class="icon-btn" id="closeComments" aria-label="Close comments">✕</button>
    </header>
    <ul id="commentList" class="comments"></ul>
    <form id="commentForm" class="comment-form">
      <input name="author" maxlength="40" placeholder="Name" class="c-author" aria-label="Your name">
      <input name="text" maxlength="300" placeholder="Add a comment…" required aria-label="Comment">
      <button class="btn btn-primary">Post</button>
    </form>
  </aside>

  <!-- ===== Mobile bottom nav ===== -->
  <nav class="bottom-nav" aria-label="Mobile">
    <button class="b-item active" data-view="new"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="b-item b-upload" data-open-upload aria-label="Upload"><span>＋</span></button>
    <button class="b-item" data-view="saved"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Saved</span></button>
  </nav>

  <!-- ===== Upload dialog ===== -->
  <dialog id="uploadDialog" class="sheet">
    <form id="uploadForm" method="dialog">
      <header class="sheet-head">
        <h2>Upload a video</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </header>

      <div class="upload-grid">
        <label class="drop" id="dropZone">
          <input type="file" name="video" id="videoInput" accept="video/*" required>
          <video id="preview" muted playsinline loop hidden></video>
          <span id="dropText">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
            Select a video<small>MP4, WebM or MOV · up to 100 MB<br>Vertical 9:16 looks best</small>
          </span>
        </label>

        <div class="fields">
          <label>Title
            <input name="title" maxlength="100" required placeholder="What's happening?">
          </label>
          <label>
            <span class="label-row">Caption <span class="small" id="descCount">0/300</span></span>
            <textarea name="description" maxlength="300" rows="4" placeholder="Describe your video and add #tags"></textarea>
          </label>
          <label>Your name
            <input name="creator" maxlength="40" placeholder="anonymous" id="creatorInput">
          </label>
        </div>
      </div>

      <div class="progress" id="progress" hidden><div></div></div>
      <p class="form-error" id="uploadError" role="alert"></p>

      <footer class="sheet-foot">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="uploadBtn">Post</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
